title: Zyrachains Frontend
description: Next.js frontend
output_file: .env

fixed_values:
  - name: UID
    detect: uid

fields:
  - name: NODE_ENV
    label: Node environment
    type: select
    default: production
    options:
      - value: production
        label: Production
      - value: development
        label: Development

  - name: FORCE_LOCAL_BACKEND
    label: Backend mode
    type: select
    default: local
    options:
      - value: local
        label: Local
        set:
          FORCE_LOCAL_BACKEND: "true"
          NEXT_PUBLIC_FORCE_LOCAL_BACKEND: "true"
      - value: remote
        label: Remote
        set:
          FORCE_LOCAL_BACKEND: "false"
          NEXT_PUBLIC_FORCE_LOCAL_BACKEND: "false"

  - name: NEXT_PUBLIC_API_URL
    label: Backend API URL
    type: text
    default: "http://localhost:4000"
    required: true

  - name: LOCAL_SERVER_URL
    label: Internal backend URL (container-to-host)
    type: text
    default: "http://host.docker.internal:4000"

  - name: NEXT_PUBLIC_HORIZON_URL
    label: Horizon proxy URL
    type: text
    default: "http://localhost:8000"
